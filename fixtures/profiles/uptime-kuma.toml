# AR15 regression fixture — a second source, exercising nested field
# paths (K9) and a conditional colour rule (generalizes VIK-4/VIK-6),
# proving K5's mapping engine is source-independent, not just working
# for the home-assistant shape.

schema_version = 1
source_id = "uptime-kuma"
target_calendar_id = "infra"

[mapping]
title_field = "monitor.name"
start_field = "time"
duration_minutes = 15
timezone = "UTC"

[mapping.color_by]
field = "status"
default = "peacock"
[mapping.color_by.values]
down = "tomato"
up = "sage"
