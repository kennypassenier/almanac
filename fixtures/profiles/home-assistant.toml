# AR15 regression fixture — the pinned profile format.
#
# Since 2.0.0 a profile says only where a source's events land. What
# each event IS comes from the call (core::request), so there is no
# field mapping here and no per-event setting to pin. What this fixture
# still guards is that the FILE format keeps loading:
# tests/mapping_regression.rs fails loudly if the event produced from
# the sample payload stops matching
# fixtures/expected/home-assistant_sample_event.json.

schema_version = 2
source_id = "home-assistant"
target_calendar_id = "primary"
timezone = "Europe/Brussels"
default_duration_minutes = 60
