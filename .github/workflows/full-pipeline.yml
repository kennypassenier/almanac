name: Full CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

  # Automatic patch version bump and tag on push to main
  auto-tag:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Get current tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "CURRENT_TAG=$TAG" >> $GITHUB_ENV

      - name: Bump patch version and tag
        run: |
          CURRENT=${{ env.CURRENT_TAG }}
          PARTS=(${CURRENT//./ })
          PATCH=${PARTS[2]}
          PATCH=$((PATCH+1))
          NEW_TAG="v${PARTS[0]#v}.${PARTS[1]}.$PATCH"
          git tag $NEW_TAG
          git push origin $NEW_TAG
        shell: bash

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Infisical CLI
        run: npm install -g infisical

      - name: Fetch secrets from Infisical
        run: infisical export --env=prod --format=dotenv > .env

      - name: Generate .env.example
        run: cat .env | sed 's/=.*$/=your_value_here/' > .env.example

      - name: Build release binary
        run: cargo build --release

      - name: Copy binary to project root
        run: cp target/release/cal-stacean ./cal-stacean

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cal-stacean-binary
          path: ./cal-stacean

      - name: Clean build artifacts
        run: |
          cargo clean
          rm -f cal-stacean .env .env.example

  docker:
    needs: build
    runs-on: ubuntu-latest
    env:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=$(git describe --tags --always 2>/dev/null || echo 'dev')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            --tag ghcr.io/${{ github.repository_owner }}/cal-stacean:${{ env.IMAGE_TAG }} \
            --tag ghcr.io/${{ github.repository_owner }}/cal-stacean:latest \
            .

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cal-stacean:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${{ github.repository_owner }}/cal-stacean:latest

  tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Get current tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "CURRENT_TAG=$TAG" >> $GITHUB_ENV

      - name: Bump patch version and tag
        run: |
          CURRENT=${{ env.CURRENT_TAG }}
          PARTS=(${CURRENT//./ })
          PATCH=${PARTS[2]}
          PATCH=$((PATCH+1))
          NEW_TAG="v${PARTS[0]#v}.${PARTS[1]}.$PATCH"
          git tag $NEW_TAG
          git push origin $NEW_TAG
        shell: bash
