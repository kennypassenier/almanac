name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      INFISICAL_API_URL: ${{ secrets.INFISICAL_API_URL }}
    steps:

      # 1. Checkout repository: Fetches the latest code from GitHub so all subsequent steps use the current source.
      - name: Checkout repository
        uses: actions/checkout@v4



      # 2. Install Rust toolchain: Ensures the correct Rust version and tools are available for building the project.
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true


      # 3. Install Infisical CLI: Installs the CLI tool for securely fetching secrets from your Infisical instance.
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical


      # 4. Fetch secrets from Infisical: Downloads environment secrets for the build and runtime, writing them to .env.

      - name: Fetch secrets from Infisical (.env) and log output
        id: infisical_export
        run: |
          set -e
          infisical export --env=prod --projectId=${{ secrets.INFISICAL_PROJECT_ID }} --format=dotenv > .env 2>infisical_export_stderr.log
          export_status=$?
          echo "=== Infisical export exit code: $export_status ==="
          echo "=== Infisical export stderr (if any): ==="
          cat infisical_export_stderr.log
          echo "=== .env keys ==="
          grep -v '^#' .env | grep '=' | cut -d= -f1 | sort
          echo "=== .env file line count ==="
          wc -l .env
          echo "=== .env file content (redacted values) ==="
          awk -F= '/^[A-Za-z0-9_]+=/{print $1 "=[REDACTED]"} !/^[A-Za-z0-9_]+=/ {print "[REDACTED]"}' .env
          echo "=== .env.example keys ==="
          grep -v '^#' .env.example | grep '=' | cut -d= -f1 | sort


      # 5. Generate .env.example: Creates a safe example env file for documentation and onboarding, based on Infisical config.
      - name: Generate .env.example
        run: infisical secrets generate-example-env --projectId=${{ secrets.INFISICAL_PROJECT_ID }}

      # Verify .env contains all keys from .env.example
      - name: Verify .env matches .env.example keys
        run: |
          missing_keys=0
          while IFS= read -r line; do
            key=$(echo "$line" | grep -v '^#' | grep -o '^[A-Za-z0-9_]\+' || true)
            if [ -n "$key" ]; then
              grep -q "^$key=" .env || { echo "Missing key in .env: $key"; missing_keys=1; }
            fi
          done < .env.example
          if [ "$missing_keys" -ne 0 ]; then
            echo "Some keys from .env.example are missing in .env"
            exit 1
          fi
          echo ".env contains all keys from .env.example"


      # 6. Commit and push .env.example if changed: Ensures .env.example in the repo is always up to date and safe for sharing.
      - name: Commit and push .env.example if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .env.example
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update .env.example [auto]' || echo 'No changes to commit.'
            git push || echo 'No changes to push.'
          fi


      # 7. Build release binary: Compiles the Rust project in release mode for optimal performance and size.
      - name: Build release binary
        run: cargo build --release


      # 8. Copy binary to project root: Moves the built binary to the root for artifact upload and Docker build context.
      - name: Copy binary to project root
        run: cp target/release/cal-stacean ./cal-stacean


      # 9. Upload build artifacts: Makes the compiled binary available for download from the workflow run.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cal-stacean-binary
          path: ./cal-stacean

      - name: Clean build artifacts
        run: cargo clean


      # 10. Log in to GitHub Container Registry: Authenticates Docker to push images to GHCR under your account using a PAT.
      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 11. Build Docker image: Builds the production Docker image for your application using the Dockerfile.
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/cal-stacean:latest .

      # 12. Push Docker image to GHCR: Publishes the built image to GitHub Container Registry for use in deployments.
      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cal-stacean:latest
